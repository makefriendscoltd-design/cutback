<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Bold.ttf')}*{box-sizing:border-box}html,body{margin:0;width:680px;height:620px;background:transparent;overflow:hidden}body{font-family:Pretendard,sans-serif;color:#15304d}#root{position:relative;width:680px;height:620px}.panel{position:absolute;left:35px;top:45px;width:600px;height:520px;border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 18px 46px rgba(21,48,77,.16);display:flex;align-items:center;justify-content:center;padding:42px;overflow:hidden}.flow{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.card,.question,.result,.mini{display:flex;align-items:center;justify-content:center;text-align:center;font-size:40px;line-height:1.14;letter-spacing:-.04em;background:#fff;border:3px solid #dce7f8;border-radius:18px;padding:22px 24px;min-width:150px;min-height:100px;box-shadow:0 10px 22px rgba(21,48,77,.10)}.target{border-color:#9bb6e5}svg.arrow{width:76px;height:34px}svg path{fill:none;stroke:#3564b6;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.pile{position:absolute;top:80px;width:410px;height:180px}.mini{position:absolute;width:250px;min-height:82px;left:80px;font-size:42px}.mini:nth-child(1){top:0;left:20px}.mini:nth-child(2){top:36px;left:80px}.mini:nth-child(3){top:72px;left:140px}.question{position:absolute;top:270px;font-size:46px}.result{position:absolute;top:390px;min-width:240px}.source{width:220px}.merge{font-size:48px;color:#3564b6}.trackrow{width:100%;display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:10px}.trackrow .card{font-size:34px;min-height:92px;padding:16px 10px}.trackrow svg{width:80px}.flow:has(.trackrow){gap:24px} 
</style><style>
.vflow{height:470px;width:100%;display:grid;grid-template-rows:115px 62px 115px 62px 115px;justify-items:center;align-items:center}.vcard{width:400px;height:105px;font-size:42px;gap:18px}.ico{display:inline-flex;width:52px;height:52px;border-radius:14px;align-items:center;justify-content:center;background:#eaf1ff;color:#3564b6;font-size:32px}.down{width:60px;height:76px}.loopstage{position:relative;width:500px;height:390px}.loopstage .node{position:absolute;width:230px;height:92px;font-size:36px;gap:12px;z-index:2}.loopstage .n0{left:135px;top:22px}.loopstage .n1{left:0;top:250px}.loopstage .n2{right:0;top:250px}.looppath{position:absolute;inset:0;width:500px;height:390px}.looppath path{fill:none;stroke:#9bb6e5;stroke-width:5}.runner{position:absolute;left:245px;top:73px;width:18px;height:18px;border-radius:50%;background:#3564b6;box-shadow:0 0 0 8px rgba(53,100,182,.16);z-index:3}
.loopstage .node{width:240px;font-size:34px;gap:10px;padding:16px 12px;white-space:nowrap}.loopstage .n0{left:130px}
</style><style>.flow.records{position:relative;height:436px;display:block}.records .card{position:absolute;min-height:95px;padding:18px 14px;white-space:nowrap}.records #c0{left:0;top:20px;width:220px}.records #c1{right:0;top:20px;width:220px}.records .merge{position:absolute;left:240px;top:37px;font-size:42px}.records #c2{left:123px;top:175px;width:270px}.records #c3{left:88px;top:326px;width:340px}.records #c3:before{content:"↓";position:absolute;top:-55px;left:147px;color:#3564b6;font-size:42px}</style></head><body><div id="root" class="clip" data-composition-id="records" data-width="680" data-height="620" data-duration="7.7" data-fps="30"><div class="panel" id="panel"><div class="flow records"><div class="card source" id="c0" data-layout-allow-occlusion>경험</div><div class="card source" id="c1" data-layout-allow-occlusion>기록</div><div class="merge">＋</div><div class="card target" id="c2">AI 자료</div><div class="card target" id="c3">직접 만들기</div></div></div></div><script src="assets/gsap.min.js"></script><script>
const DURATION=7.7; const tl=gsap.timeline({paused:true});
tl.fromTo('#panel',{autoAlpha:0,scale:.97},{autoAlpha:1,scale:1,duration:.25,ease:'power3.out'},0);
tl.set(['#c0','#c1','#c2','#c3','.merge'],{autoAlpha:0},0);
 tl.fromTo('.source',{autoAlpha:0,y:15},{autoAlpha:1,y:0,duration:.25,stagger:.3,immediateRender:false},.25)
 .fromTo('.merge',{autoAlpha:0},{autoAlpha:1,duration:.2,immediateRender:false},.65)
 .to('#c0',{x:140,y:155,autoAlpha:0,duration:.6,ease:'power2.inOut'},1.9)
 .to('#c1',{x:-140,y:155,autoAlpha:0,duration:.6,ease:'power2.inOut'},1.9)
 .to('.merge',{autoAlpha:0,duration:.25},2)
 .fromTo('#c2',{autoAlpha:0,scale:.82},{autoAlpha:1,scale:1,duration:.35,ease:'power3.out',immediateRender:false},2.4)
 .fromTo('#c3',{autoAlpha:0,y:25},{autoAlpha:1,y:0,duration:.35,ease:'power3.out',immediateRender:false},4.6)
 .to('#c3',{backgroundColor:'#3564b6',color:'#fff',duration:.3},5);
tl.to('#panel',{autoAlpha:0,duration:.22,ease:'power2.in'},DURATION-.22);
window.__timelines['records']=tl; tl.seek(0);
</script></body></html>
