<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 직원 조직도 와이어프레임</title>
<style>
@font-face{font-family:P;src:url(assets/Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(assets/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(assets/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(assets/Pretendard-ExtraBold.woff2);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1130px;overflow:hidden;background:#0b1726;color:#d7e3f0;font-family:P,system-ui,sans-serif}
#stage{position:relative;width:1080px;height:1130px;background:#0b1726;overflow:hidden}
#stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#1a3350 1px,transparent 1px);background-size:28px 28px;opacity:.35;pointer-events:none}
.chrome{position:absolute;left:36px;right:36px;top:28px;height:72px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #1e3a58;padding-bottom:14px;z-index:4}
.chrome .school{font:800 22px/1 P;letter-spacing:-.04em;color:#8fb4e8}
.chrome .meta{font:600 18px/1 P;color:#6d8aaa}
.chrome .count{font:800 22px/1 P;color:#f5f7fa}
.world{position:absolute;left:0;top:0;width:1080px;height:1130px}
body[data-f="3"] .world,body[data-f="3"] .hub,body[data-f="3"] svg.leads,body[data-f="3"] .bays,body[data-f="3"] .log{display:none}
.punch{display:none;position:absolute;inset:0}
body[data-f="3"] .punch{display:block}
.hub{position:absolute;left:330px;top:118px;width:420px;height:86px;border:1.5px solid #3d6aa3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1726cc;z-index:3}
.hub b{font:800 28px/1 P;letter-spacing:-.05em;color:#f5f7fa}
.hub span{margin-top:8px;font:600 15px/1 P;color:#7ea0c4}
svg.leads{position:absolute;left:0;top:118px;width:1080px;height:180px;z-index:1}
.bays{position:absolute;left:28px;right:28px;top:228px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;z-index:2}
.bay{border:1px solid #23486c;min-height:700px;padding:10px 8px 12px;position:relative}
.bay .t{font:800 17px/1 P;color:#8fb4e8;text-align:center;padding:6px 0 12px;border-bottom:1px dashed #23486c;margin-bottom:12px}
.seat{height:148px;margin:0 0 10px;border:1.5px dashed #2a5078;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;color:#4d6d8c}
.seat i{width:34px;height:34px;border:1.5px dashed #2a5078;border-radius:50%;display:block;margin-bottom:10px}
.seat b{font:700 16px/1.2 P;letter-spacing:-.04em;text-align:center;word-break:keep-all}
.seat em{font:600 12px/1 P;margin-top:6px;font-style:normal;color:#3d5c78}
.bay.on{border-color:#3d7ad0;background:#10233a}
.bay.on .t{color:#cfe2ff;border-color:#3d7ad0}
.seat.hired{border:1.5px solid #d7e0ea;background:#f5f7fa;color:#122940}
.seat.hired i{border:0;background:#122940}
.seat.today{border:2.5px solid #2563eb;background:#f5f7fa;color:#122940;box-shadow:0 0 0 6px #2563eb33}
.seat.today i{border:0;background:#2563eb}
.bay.today{border-color:#2563eb;background:#0e2744}
.bay.today .t{color:#f5f7fa;border-color:#2563eb}
.log{position:absolute;left:36px;right:36px;bottom:28px;height:86px;border:1px solid #23486c;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:4;background:#0b1726ee}
.log p{font:600 20px/1.3 P;letter-spacing:-.04em;color:#9cb6d0}
.log strong{color:#f5f7fa;font-weight:800}
.punch .ghost{position:absolute;inset:0;opacity:.22;pointer-events:none}
.punch .col{position:absolute;left:48px;top:130px;width:420px;bottom:48px;border:1.5px solid #2563eb;padding:22px 18px}
.punch .col .t{font:800 22px/1 P;color:#cfe2ff;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed #2563eb}
.punch .hero{border:2.5px solid #2563eb;background:#f5f7fa;color:#122940;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:14px}
.punch .hero i{width:72px;height:72px;border-radius:50%;background:#2563eb;display:block;margin-bottom:18px}
.punch .hero b{font:800 36px/1.15 P;letter-spacing:-.06em;text-align:center}
.punch .hero em{font:700 16px/1 P;font-style:normal;color:#5b6b7c;margin-top:10px}
.punch .wait{height:118px;border:1.5px dashed #2a5078;margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#6d8aaa;font:700 22px/1 P}
.punch .term{position:absolute;left:500px;top:210px;width:532px;height:520px;border:1.5px solid #3d7ad0;background:#071018;padding:28px 26px}
.punch .bar{display:flex;gap:8px;margin-bottom:18px}
.punch .bar u{width:12px;height:12px;border-radius:50%;background:#2a5078;display:block;text-decoration:none}
.punch .path{font:600 18px/1 P;color:#6d8aaa;margin-bottom:22px}
.punch pre{font:800 32px/1.4 P;white-space:pre-wrap;word-break:keep-all;color:#f5f7fa;letter-spacing:-.05em}
.punch .hint{position:absolute;left:500px;bottom:48px;width:532px;font:700 22px/1.35 P;color:#cfe2ff;letter-spacing:-.04em}
body[data-f="1"] .seat.hired,body[data-f="1"] .seat.today{border:1.5px dashed #2a5078;background:transparent;color:#4d6d8c;box-shadow:none}
body[data-f="1"] .seat.hired i,body[data-f="1"] .seat.today i{border:1.5px dashed #2a5078;background:transparent}
body[data-f="1"] .bay.on,body[data-f="1"] .bay.today{border-color:#23486c;background:transparent}
body[data-f="1"] .bay.on .t,body[data-f="1"] .bay.today .t{color:#8fb4e8;border-color:#23486c}
body[data-f="2"] .seat.today{border:1.5px dashed #2a5078;background:transparent;color:#4d6d8c;box-shadow:none}
body[data-f="2"] .seat.today i{border:1.5px dashed #2a5078;background:transparent}
body[data-f="2"] .bay.today{border-color:#23486c;background:transparent}
body[data-f="2"] .bay.today .t{color:#8fb4e8;border-color:#23486c}
</style>
</head>
<body data-f="1">
<div id="stage">
  <div class="chrome">
    <div class="school">AI 직원 양성학교</div>
    <div class="meta" id="meta">조직도 · 도면</div>
    <div class="count" id="count">0 / 24</div>
  </div>
  <div class="world" id="world">
    <div class="hub"><b>우리 회사</b><span>6팀 · 24명 자리</span></div>
    <svg class="leads" viewBox="0 0 1080 180">
      <path d="M540 86 V118" stroke="#3d6aa3" stroke-width="1.5" fill="none"/>
      <path d="M118 118 H962" stroke="#3d6aa3" stroke-width="1.5" fill="none"/>
      <path d="M118 118 V162 M286 118 V162 M454 118 V162 M622 118 V162 M790 118 V162 M958 118 V162" stroke="#3d6aa3" stroke-width="1.5" fill="none"/>
    </svg>
    <div class="bays" id="bays"></div>
  </div>
  <div class="log"><p id="logline">빈 자리 24. 오늘 출근시킬 직원 없음.</p></div>
  <div class="punch">
    <div class="col">
      <div class="t">콘텐츠팀</div>
      <div class="hero"><i></i><b>콘텐츠 기획자</b><em>01 · 오늘 출근</em></div>
      <div class="wait">영상편집자</div>
      <div class="wait">숏폼 영상편집자</div>
      <div class="wait">유튜브 채널 관리자</div>
    </div>
    <div class="term">
      <div class="bar"><u></u><u></u><u></u></div>
      <div class="path">콘텐츠기획자/</div>
      <pre>이 폴더에 콘텐츠 기획자
AI 직원을 만들어줘.</pre>
    </div>
    <div class="hint">이 자리의 프롬프트가 곧 타이핑됩니다.</div>
  </div>
</div>
<script>
const teams = [
  {name:'콘텐츠팀', today:true, jobs:['콘텐츠 기획자','영상편집자','숏폼 영상편집자','유튜브 채널 관리자']},
  {name:'글쓰기팀', jobs:['콘텐츠 에디터','블로그 마케터','카페 바이럴 마케터','출판 편집자']},
  {name:'홍보팀', jobs:['SNS 마케터','릴스 PD','네이버 카페 관리자','카카오톡 채널 관리자']},
  {name:'디자인팀', hired:true, jobs:['그래픽 디자이너','SNS 콘텐츠 디자이너','PPT 디자이너','상세페이지 디자이너']},
  {name:'고객지원팀', jobs:['쇼핑몰 CS 담당자','쇼핑몰 운영 관리자','퍼포먼스 마케터','출고·배송 관리 담당자']},
  {name:'경영지원팀', jobs:['비서','운영 매니저','시스템 모니터링 요원','IT 운영 담당자']}
];
const f = new URLSearchParams(location.search).get('f') || '1';
document.body.dataset.f = f;
const bays = document.getElementById('bays');
teams.forEach((team, ti) => {
  const bay = document.createElement('div');
  bay.className = 'bay' + (team.hired ? ' on' : '') + (team.today ? ' today' : '');
  bay.innerHTML = `<div class="t">${team.name}</div>` + team.jobs.map((job, ji) => {
    const today = team.today && ji === 0;
    const hired = team.hired;
    const cls = today ? 'seat today' : hired ? 'seat hired' : 'seat';
    return `<div class="${cls}"><i></i><b>${job}</b><em>${String(ti*4+ji+1).padStart(2,'0')}</em></div>`;
  }).join('');
  bays.appendChild(bay);
});
const meta = document.getElementById('meta');
const count = document.getElementById('count');
const logline = document.getElementById('logline');
if (f === '1') {
  meta.textContent = '조직도 · 도면';
  count.textContent = '0 / 24';
  logline.innerHTML = '빈 자리 24. <strong>지금부터 AI 직원을 만듭니다.</strong>';
} else if (f === '2') {
  meta.textContent = '디자인팀 출근';
  count.textContent = '4 / 24';
  logline.innerHTML = '디자인팀 4명 출근. <strong>다음 자리는 콘텐츠팀.</strong>';
} else {
  meta.textContent = '8일차 · 콘텐츠 기획자';
  count.textContent = '5 / 24';
  logline.innerHTML = '<strong>콘텐츠 기획자 출근.</strong> 프롬프트를 이 자리에 넣습니다.';
}
</script>
</body>
</html>
