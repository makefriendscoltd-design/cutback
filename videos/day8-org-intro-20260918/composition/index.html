<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Pretendard;src:url(assets/font.ttf);font-weight:600}
@font-face{font-family:Black;src:url(assets/black.ttf);font-weight:900}
*{box-sizing:border-box}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
#day8{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Pretendard,sans-serif}
.clip{position:absolute}
.bg{left:0;top:0;width:1080px;height:1920px;z-index:1;background:#0b0b0d}
#hook{left:0;top:0;width:1080px;height:1920px;z-index:8;overflow:hidden;background:#141820}
#hook-cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 28%;will-change:transform;display:flex;align-items:center;justify-content:center;color:#8a97a5;font:700 42px/1.3 Pretendard;letter-spacing:-.04em;text-align:center}
#intro{left:0;top:0;width:1080px;height:1130px;z-index:3;object-fit:cover}
#person-slot{left:0;top:0;width:1080px;height:1920px;z-index:10}
#person-box{position:absolute;left:60px;top:1235px;width:960px;height:640px;overflow:hidden;border-radius:28px;box-shadow:0 26px 50px #0005;background:#141820}
#person-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a97a5;font:700 36px/1.3 Pretendard;letter-spacing:-.04em;text-align:center}
.head{left:40px;right:40px;top:360px;z-index:30;text-align:center;color:#fff;font:900 122px/1.05 Black;letter-spacing:-3px;word-break:keep-all;-webkit-text-stroke:7px #171d20;paint-order:stroke fill;text-shadow:0 6px 8px #000}
</style>
</head>
<body>
<div id="day8" data-composition-id="day8" data-width="1080" data-height="1920" data-start="0" data-duration="7">
  <div id="bg" class="clip bg" data-start="0" data-duration="7" data-track-index="1"></div>
  <div id="hook" class="clip" data-start="0" data-duration="2" data-track-index="8">
    <div id="hook-cam">0~2초 풀프레임 후킹<br>촬영본 대기</div>
  </div>
  <video id="intro" class="clip" src="assets/org-intro.mp4" data-start="2" data-duration="5" data-media-start="0" data-track-index="3" muted></video>
  <div id="person-slot" class="clip" data-start="2" data-duration="5" data-track-index="10">
    <div id="person-box"><div id="person-wait">8일차 촬영본 대기</div></div>
  </div>
  <div id="head-clip" class="clip head" data-start="0.25" data-duration="1.75" data-track-index="30"><div id="head">POV: AI 미친자가<br>저지른 일</div></div>
</div>
<script>
const tl = gsap.timeline({paused:true});
tl.set("#hook-cam",{scale:2.35},0);
tl.to("#hook-cam",{scale:1,duration:0.22,ease:"power3.inOut"},0.03);
tl.to("#hook-cam",{scale:1.35,duration:0.28,ease:"power2.inOut"},1.15);
tl.fromTo("#head",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.20,ease:"power3.out",immediateRender:false},0.25);
tl.to("#head",{opacity:0,duration:0.16},1.84);
tl.set("#head",{opacity:0},2.00);
window.__timelines["day8"] = tl;
</script>
</body>
</html>
