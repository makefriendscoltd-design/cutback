<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Dokdo;src:url('assets/EastSeaDokdo.ttf')}@font-face{font-family:Pretendard;src:url('assets/Pretendard-SemiBold.ttf');font-weight:600}
*{box-sizing:border-box}html,body{margin:0;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:#111820}#root{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden}#stage{position:absolute;left:0;top:0;width:{{DESIGN_WIDTH}}px;height:{{DESIGN_HEIGHT}}px;transform:scale({{SCALE}});transform-origin:0 0;overflow:hidden}.clip{position:absolute}.bg{inset:-70px;width:1220px;height:2060px;object-fit:cover;filter:blur(34px) brightness(.7);transform:scale(1.08)}.presenter{mask-image:linear-gradient(to bottom,transparent 0,#000 115px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 115px)}.screen{z-index:31;box-shadow:0 12px 28px rgba(0,0,0,.38)}.caption{z-index:75;display:flex;justify-content:center;align-items:flex-start;text-align:center;font-family:Pretendard}.fragments{z-index:50;display:flex;flex-direction:column;align-items:center}.frag-line{display:flex;align-items:center;margin-top:-4px;min-height:102px}.paper{display:inline-block;margin-right:-3px;white-space:nowrap;filter:drop-shadow(0 5px 9px rgba(0,0,0,.25));clip-path:polygon(1% 5%,18% 1%,40% 4%,62% 0,83% 3%,99% 1%,97% 28%,100% 52%,98% 76%,100% 97%,76% 99%,55% 96%,31% 100%,2% 97%,4% 71%,1% 49%,3% 25%)}.step{z-index:55;inset:0}.step-num,.step-title{position:absolute;display:flex;align-items:center;background:#fffdf7;color:#111;font-family:Dokdo;filter:drop-shadow(0 5px 9px rgba(0,0,0,.25))}.step-num{justify-content:center;clip-path:polygon(2% 3%,26% 1%,53% 4%,79% 0,98% 4%,96% 34%,100% 61%,97% 96%,68% 99%,42% 96%,4% 100%,2% 69%,5% 37%)}.step-title{padding:3px 15px;white-space:nowrap;clip-path:polygon(1% 8%,19% 2%,43% 5%,68% 1%,98% 4%,99% 34%,97% 66%,100% 94%,75% 98%,51% 95%,27% 99%,2% 94%,4% 61%)}
</style></head><body>
<main id="root" data-composition-id="reel-reference-edit" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="{{DURATION}}" data-fps="{{FPS}}"><div id="stage"><video id="background-video" class="clip bg" data-layout-allow-overflow data-start="0" data-duration="{{DURATION}}" src="assets/source-video.mp4" muted playsinline></video><video id="presenter-video" class="clip presenter" data-layout-allow-overflow data-start="0" data-duration="{{DURATION}}" src="assets/source-video.mp4" muted playsinline></video>{{MEDIA_TAGS}}</div></main>
<script src="assets/gsap.min.js"></script><script>
const P={{PAYLOAD}},G={{GEOMETRY}},root=document.querySelector('#stage'),rots=[-1.5,.8,-.4,1.2],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const presenter=document.querySelector('.presenter');Object.assign(presenter.style,{left:G.presenter.left+'px',top:G.presenter.top+'px',width:G.presenter.width+'px',height:G.presenter.height+'px',objectFit:G.presenter.object_fit});
document.querySelectorAll('.screen').forEach(x=>Object.assign(x.style,{left:G.supporting_asset.left+'px',top:G.supporting_asset.top+'px',width:G.supporting_asset.width+'px',height:G.supporting_asset.height+'px',objectFit:G.supporting_asset.object_fit}));
for(const [i,b] of P.manifest.upper_beats.entries()){let x;if(b.kind==='fragments'){x=document.createElement('div');x.className='clip fragments';Object.assign(x.style,{left:G.fragments.left+'px',top:G.fragments.top+'px',width:G.fragments.width+'px'});x.innerHTML=b.lines.map((line,n)=>'<div class="frag-line">'+(Array.isArray(line)?line:[line]).flatMap(v=>String(v).split(' ')).map((v,k)=>`<span class="paper" style="transform:rotate(${rots[(n+k)%4]}deg);font-size:${G.fragments.font_sizes[Math.min(n,G.fragments.font_sizes.length-1)]}px;line-height:${G.fragments.line_height};padding:${G.fragments.padding[0]}px ${G.fragments.padding[1]}px ${G.fragments.padding[2]}px;background:${G.fragments.paper_color};color:${G.fragments.text_color};font-family:${G.fragments.font_family}">${esc(v)}</span>`).join('')+'</div>').join('')}else if(b.kind==='step'){x=document.createElement('div');x.className='clip step';x.innerHTML=`<span class="step-num"><span>${esc(b.number)}</span></span><span class="step-title">${esc(b.title)}</span>`;const n=x.querySelector('.step-num'),t=x.querySelector('.step-title');Object.assign(n.style,{left:G.step_number.left+'px',top:G.step_number.top+'px',width:G.step_number.width+'px',height:G.step_number.height+'px',fontSize:G.step_number.font_size+'px',transform:`rotate(${G.step_number.rotation}deg)`});Object.assign(t.style,{left:G.step_title.left+'px',top:G.step_title.top+'px',minWidth:G.step_title.min_width+'px',maxWidth:G.step_title.max_width+'px',height:G.step_title.height+'px',fontSize:G.step_title.font_size+'px',transform:`rotate(${G.step_title.rotation}deg)`})}if(x){x.id='upper-'+i;x.dataset.start=b.start;x.dataset.duration=(b.end-b.start).toFixed(3);root.appendChild(x)}}
for(const [i,c] of P.captions.entries()){const x=document.createElement('div');x.id='cap-'+i;x.className='clip caption';x.dataset.start=c.start;x.dataset.duration=(c.end-c.start).toFixed(3);x.textContent=c.text;Object.assign(x.style,{left:G.caption.left+'px',top:G.caption.top+'px',width:G.caption.width+'px',minHeight:G.caption.min_height+'px',fontSize:G.caption.font_size+'px',fontWeight:G.caption.font_weight,lineHeight:G.caption.line_height,letterSpacing:G.caption.letter_spacing+'px',color:G.caption.color,textShadow:G.caption.text_shadow});root.appendChild(x)}
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true}),fade=G.motion.enter_fade;P.manifest.upper_beats.forEach((b,i)=>{if(b.kind==='fragments')tl.fromTo('#upper-'+i+' .paper',{opacity:0,y:-5},{opacity:1,y:0,duration:fade,stagger:.07,ease:'none'},b.start);if(b.kind==='step'){tl.fromTo('#upper-'+i+' .step-num',{opacity:0},{opacity:1,duration:fade,ease:'none'},b.start);tl.fromTo('#upper-'+i+' .step-title',{opacity:0},{opacity:1,duration:fade,ease:'none'},b.start+G.motion.number_to_title_delay)}});P.captions.forEach((c,i)=>tl.fromTo('#cap-'+i,{opacity:0},{opacity:1,duration:fade,ease:'none'},c.start));const clock={t:0};tl.to(clock,{t:{{DURATION}},duration:{{DURATION}},ease:'none'},0);window.__timelines['reel-reference-edit']=tl;
</script></body></html>
